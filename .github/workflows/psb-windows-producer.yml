name: PSB Windows Producer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Generate one-time RSA key
        shell: pwsh
        run: |
          $rsa=[System.Security.Cryptography.RSA]::Create(4096)
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\public.pem",$rsa.ExportSubjectPublicKeyInfoPem())
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\private.pem",$rsa.ExportPkcs8PrivateKeyPem())
      - uses: actions/upload-artifact@v4
        with:
          name: psb-one-time-public-key
          path: ${{ runner.temp }}\public.pem
          retention-days: 1
      - name: Wait for encrypted producer payload
        shell: pwsh
        run: |
          $branch='psb-windows-producer-20260824'
          $repo='${{ github.repository }}'
          $deadline=(Get-Date).AddMinutes(12)
          do {
            try {
              $base="https://raw.githubusercontent.com/$repo/$branch/.psb-producer"
              Invoke-WebRequest "$base/manifest.json" -OutFile "$env:RUNNER_TEMP\payload-manifest.json" -ErrorAction Stop
              $m=Get-Content -Raw "$env:RUNNER_TEMP\payload-manifest.json" | ConvertFrom-Json
              $out=[IO.File]::Open("$env:RUNNER_TEMP\payload.enc",[IO.FileMode]::Create,[IO.FileAccess]::Write)
              try {
                for($i=0;$i -lt [int]$m.chunk_count;$i++){
                  $name=('{0:D3}.part' -f $i)
                  $part="$env:RUNNER_TEMP\$name"
                  Invoke-WebRequest "$base/chunks/$name" -OutFile $part -ErrorAction Stop
                  $b=[IO.File]::ReadAllBytes($part);$out.Write($b,0,$b.Length)
                }
              } finally { $out.Dispose() }
              $got=(Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\payload.enc").Hash.ToLower()
              if($got -ne [string]$m.payload_sha256){throw 'Encrypted payload SHA mismatch'}
              Invoke-WebRequest "$base/key.enc" -OutFile "$env:RUNNER_TEMP\key.enc" -ErrorAction Stop
              Invoke-WebRequest "$base/iv.txt" -OutFile "$env:RUNNER_TEMP\iv.txt" -ErrorAction Stop
              Invoke-WebRequest "$base/tag.txt" -OutFile "$env:RUNNER_TEMP\tag.txt" -ErrorAction Stop
              $ok=$true
            } catch { $ok=$false; Remove-Item "$env:RUNNER_TEMP\payload.enc" -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 10 }
          } while(-not $ok -and (Get-Date) -lt $deadline)
          if(-not $ok){throw 'Encrypted producer payload was not supplied in time.'}
      - name: Decrypt payload in runner temp
        shell: pwsh
        run: |
          $rsa=[System.Security.Cryptography.RSA]::Create()
          $rsa.ImportFromPem([IO.File]::ReadAllText("$env:RUNNER_TEMP\private.pem"))
          $aesKey=$rsa.Decrypt([IO.File]::ReadAllBytes("$env:RUNNER_TEMP\key.enc"),[System.Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          $iv=[Convert]::FromBase64String((Get-Content -Raw "$env:RUNNER_TEMP\iv.txt").Trim())
          $tag=[Convert]::FromBase64String((Get-Content -Raw "$env:RUNNER_TEMP\tag.txt").Trim())
          $cipher=[IO.File]::ReadAllBytes("$env:RUNNER_TEMP\payload.enc")
          $plain=New-Object byte[] $cipher.Length
          $aes=[System.Security.Cryptography.AesGcm]::new($aesKey,16)
          $aes.Decrypt($iv,$cipher,$tag,$plain,$null)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\producer_input.zip",$plain)
          Expand-Archive "$env:RUNNER_TEMP\producer_input.zip" "$env:RUNNER_TEMP\input" -Force
      - name: Recover immutable source from candidate
        shell: pwsh
        run: |
          $in="$env:RUNNER_TEMP\input\psb_producer_input"
          $cand="$in\Personal_Second_Brain_PHASE1_WINDOWS_USER_PACKAGE_BUILD_BLOCKED_CANDIDATE_20260823.zip"
          $tmp="$env:RUNNER_TEMP\candidate_for_source"
          Expand-Archive $cand $tmp -Force
          $src=Get-ChildItem $tmp -Recurse -File -Filter 'Personal_Second_Brain_PHASE1_WINDOWS_LOCAL_CORE_CHECKPOINT_20260823.zip' | Select-Object -First 1
          if(-not $src){throw 'Embedded immutable source checkpoint not found'}
          Copy-Item $src.FullName "$in\Personal_Second_Brain_PHASE1_WINDOWS_LOCAL_CORE_CHECKPOINT_20260823.zip" -Force
          $got=(Get-FileHash -Algorithm SHA256 "$in\Personal_Second_Brain_PHASE1_WINDOWS_LOCAL_CORE_CHECKPOINT_20260823.zip").Hash.ToLower()
          if($got -ne '820ce103435fbfac1315aba3a41c4a54a4c48adb161e06182851616368bbd5dc'){throw 'SOURCE BASELINE MISMATCH'}
      - name: Prepare producer prerequisites
        shell: pwsh
        run: |
          python --version
          node --version
          npm --version
          rustc --version
          cargo --version
          choco install tesseract --yes --no-progress
      - name: Build verified Windows package
        shell: pwsh
        run: |
          $in="$env:RUNNER_TEMP\input\psb_producer_input"
          & "$in\overlay\producer_build.ps1" -CheckpointZip "$in\Personal_Second_Brain_PHASE1_WINDOWS_LOCAL_CORE_CHECKPOINT_20260823.zip" -PackagingCandidateZip "$in\Personal_Second_Brain_PHASE1_WINDOWS_USER_PACKAGE_BUILD_BLOCKED_CANDIDATE_20260823.zip" -OverlayDir "$in\overlay" -OutDir "$env:RUNNER_TEMP\out"
      - name: Encrypt build outputs for return
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP\out\*" -DestinationPath "$env:RUNNER_TEMP\out.zip" -CompressionLevel Optimal
          $returnKey=[IO.File]::ReadAllBytes("$env:RUNNER_TEMP\input\psb_producer_input\return_key.bin")
          $nonce=New-Object byte[] 12; [Security.Cryptography.RandomNumberGenerator]::Fill($nonce)
          $plain=[IO.File]::ReadAllBytes("$env:RUNNER_TEMP\out.zip");$cipher=New-Object byte[] $plain.Length;$tag=New-Object byte[] 16
          $aes=[Security.Cryptography.AesGcm]::new($returnKey,16);$aes.Encrypt($nonce,$plain,$cipher,$tag,$null)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\psb-output.enc",$cipher)
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\psb-output-nonce.txt",[Convert]::ToBase64String($nonce))
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\psb-output-tag.txt",[Convert]::ToBase64String($tag))
      - uses: actions/upload-artifact@v4
        with:
          name: psb-encrypted-windows-output
          path: |
            ${{ runner.temp }}\psb-output.enc
            ${{ runner.temp }}\psb-output-nonce.txt
            ${{ runner.temp }}\psb-output-tag.txt
          retention-days: 1
